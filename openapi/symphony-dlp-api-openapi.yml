  /v1/dlp/dictionaries/{dictId}/data/upload:
    post:
      tags:
      - Dlp
      summary: Symphony Override Dictionary Content With Provided Content
      description: Override dictionary content with provided content.
      parameters:
      - name: sessionToken
        in: header
