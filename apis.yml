aid: symphony
url: https://raw.githubusercontent.com/api-evangelist/symphony/refs/heads/main/apis.yml
name: Symphony
description: >-
  Symphony is a secure collaboration platform designed for professional teams, particularly in financial services. It
  provides end-to-end encrypted messaging, voice, video, and workflows for regulated industries. Symphony's developer
  platform enables bot automation, workflow integrations, and extension apps through a suite of REST APIs including the
  Pod API, Agent API, Authenticator API, Login API, Profile Manager API, and Community Connect API.
